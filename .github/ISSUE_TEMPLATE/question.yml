name: 使用求助 / 其他
description: 不会用、找不到入口、环境问题，或者不知道该选哪个分类
title: "[求助] "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        先翻一眼 README 的[常见问题](https://github.com/AUGUHDAR/WUHUICL#常见问题)和[现在到什么程度](https://github.com/AUGUHDAR/WUHUICL#现在到什么程度)——**"点连接没反应"这类多半是写在状态表里的未接线功能，不是 BUG**。
  - type: textarea
    id: ask
    attributes:
      label: 你想问什么 / 卡在哪一步
      placeholder: 想把我现有的 .minecraft 直接拿过来用，找不到入口
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 已经试过什么
  - type: input
    id: env
    attributes:
      label: 版本与系统
      placeholder: v0.1.0 · Windows 11 23H2
