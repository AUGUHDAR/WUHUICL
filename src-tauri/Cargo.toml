[package]
name = "wuhuicl"
version = "1.0.3"
description = "WUHUICL - 简约美观的一键式 Minecraft 启动器"
edition = "2021"
rust-version = "1.82"

# 本地 wry 补丁：Windows 上 OS 文本拖拽（authlib-injector 皮肤站卡片拖入）被上游
# 只认 CF_HDROP 的 IDropTarget 静默丢弃。vendor/wry 里加 CF_UNICODETEXT 分支，
# 文本以 `wuhuicl-text:<内容>` 伪路径进入既有 DragDropEvent.paths，协议不变。
[patch.crates-io]
wry = { path = "vendor/wry" }

# Tauri 移动端（Android）要求 lib 以 staticlib/cdylib 产出；rlib 供桌面 main.rs 使用
[lib]
name = "wuhuicl"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 种子地图：编译 vendor/cubiomes C 库 + seed_map/cubiomes_bridge.c
cc = "1"


[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
md-5 = "0.10"
hex = "0.4"
chrono = "0.4"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "blocking"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "io-util", "time", "net"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
regex = "1"
url = "2"
rand = "0.9"
flate2 = "1"
# 种子地图/投影工坊：level.dat / 投影文件 NBT 解析（与 Axolotl 同库）
quartz_nbt = "0.2"
[target.'cfg(not(target_os = "android"))'.dependencies]
# 跨平台回收站删除（Windows IFileOperation / macOS Finder / Linux freedesktop Trash），
# 替换原 PowerShell Microsoft.VisualBasic 方案。trash crate 不支持 Android，故门控；
# Android 侧 recycle_bin_delete 降级为直接删除。
trash = "5"

[target.'cfg(unix)'.dependencies]
# sysconf（内存）与 statvfs（磁盘空闲）、kill 信号等 unix 基础调用
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"
# 最小化自整理：ICoreWebView2_3::TrySuspend 挂起渲染进程（与 tauri/wry 同版本，类型互通）
webview2-com = "0.39"
# 原生拖出（DoDragDrop + CF_HDROP）：与 vendor/wry 同版本，特性保持最小集
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  # 服务器 SLP 探测：_minecraft._tcp SRV 记录解析（DnsQuery_W）
  "Win32_NetworkManagement_Dns",
  # 标题栏：SetWindowSubclass 持续剥掉原生 WS_SYSMENU（防幽灵窗口按钮）
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# seed_map 单元测试写临时 level.dat
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
